  random_strength: 0.0
  rsm: 1.0
  boosting_type: Plain
  has_time: true
  one_hot_max_size: 64
  nan_mode: Min
  use_best_model: false
  allow_writing_files: false
  verbose: false
pass_eval_set: false
early_stopping: false
sample_weight: uniform
target_transform: identity
sort_training_by:
- reference_time
- stable_tap_key
- sample_id
