version: round2-v3-local-search
phase: local_search
data_version: synthetic_round2_v2

# Current reference is the latest user-reported platform best, not the older
# C2+B3 96.0982 snapshot.  Keep this block frozen for the first V3 batch.
current_platform_best:
  candidate: AJ3_IRON
  score: 96.1259
  source: docs/round2_final_top5/FEEDBACK.md
  local_reference_run: local/runs/round2-v2.6/joint-seeds-r1
  local_reference_candidate: AJ3
  local_reference_score: 96.0123883047359
  local_iron_wmape: 0.03927009
  local_time_wmape: 0.040482139256378766
sprint_target_platform_score: 96.2
sprint_target_local_gain: [0.15, 0.20]

search_budget:
  total: 400
  catboost: 240
  lightgbm: 40
  xgboost: 40
  mlp: 20
  kernel: 20
  expression: 40
  per_target: 200

stages:
  coarse:
    seeds: [42]
    folds_per_seed: 2
    early_stopping: true
    keep_per_target: 12
  refine:
    seeds: [42, 3407]
    folds_per_seed: 5
    keep_per_target: 3
  confirm:
    seeds: [42, 3407, 2026]
    folds_per_seed: 5
    keep_packages: 2

catboost_space:
  depth: [3, 8]
  learning_rate_log10: [-2.0, -0.8239087409446734]  # 0.01 .. 0.15
  l2_leaf_reg_log10: [-1.0, 2.0]                  # 0.1 .. 100
  iterations: [1000, 1500, 2000, 3000, 4000]
  random_strength_log10: [-2.0, 0.6989700043360189]
  loss_functions: [RMSE, MAE, "Huber:delta=0.02", "Huber:delta=0.05"]
  boosting_types: [Plain, Plain, Plain, Ordered]
  grow_policies: [SymmetricTree, SymmetricTree, SymmetricTree, SymmetricTree, Depthwise, Lossguide]
  bootstrap_types: [MVS, Bayesian, Bernoulli, "No"]
  feature_sets: [raw, raw, raw, raw, four]
  target_transforms: [mean, mean, mean, mean_std, identity, log1p]

lightgbm_space:
  n_estimators: [800, 1200, 2000, 3000, 4000]
  learning_rate_log10: [-2.0, -1.0]               # 0.01 .. 0.1
  num_leaves: [15, 31, 63, 127, 255]
  max_depth: [-1, 3, 4, 5, 6, 8, 10]
  min_child_samples_log10: [0.6989700043360189, 2.0]  # 5 .. 100
  reg_alpha_log10: [-2.0, 2.0]
  reg_lambda_log10: [-2.0, 2.0]
  feature_sets: [raw, raw, raw, four]
  target_transforms: [mean, mean, mean, mean_std, identity, log1p]

xgboost_space:
  n_estimators: [800, 1200, 2000, 3000]
  learning_rate_log10: [-2.0, -1.0]
  max_depth: [3, 4, 5, 6, 8]
  min_child_weight_log10: [-1.0, 1.0]
  reg_alpha_log10: [-2.0, 2.0]
  reg_lambda_log10: [-2.0, 2.0]
  subsample: [0.6, 1.0]
  colsample_bytree: [0.5, 1.0]
  feature_sets: [raw, raw, four]
  target_transforms: [mean, mean, mean_std, identity, log1p]

mlp_kernel_space:
  feature_sets: [raw, four]
  target_transforms: [mean, mean_std, identity, log1p]
  mlp_hidden_layers: [[32], [64], [32, 16], [64, 32]]
  mlp_alpha_log10: [-4.0, 1.0]
  kernel: [rbf, polynomial]
  kernel_alpha_log10: [-4.0, 1.0]

submission_thresholds:
  below_independent: 0.02
  fallback_upper: 0.05
  independent_candidate: 0.05
  primary_candidate: [0.15, 0.20]

fusion:
  max_members: 5
  max_pool: 30
  selection: greedy_forward_nested
  weight_constraints: {nonnegative: true, sum_to_one: true}
  seeds: [42, 3407]
  no_dynamic_weights: true

publication:
  upload_actor: user
  daily_cap_user_stated: 5
  agent_uploads: false
  no_automatic_packages: true
