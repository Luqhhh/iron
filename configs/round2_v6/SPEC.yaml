# left three execution details unspecified - the fusion alpha grid, the fit budget
# for the coarse screen of the new iron capacity space (which has no recorded
# folds 0/1 predictions), and the frozen reference paths the column replay reads.
# All three were added BEFORE any V6 fit or evaluation.  No threshold, gate, stop
# rule or budget cap was relaxed.
