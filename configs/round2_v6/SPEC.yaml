# Round2 V6 pre-registration contract.
#
# Written BEFORE any V6 fit or evaluation.  Thresholds, budgets and stop rules in
# this file are frozen: `src/bf_tap_r2/v6_spec.py` refuses to load a weakened
# revision, exactly as the V5 loader does.  Only `status` may be annotated after
# execution.
#
# Design basis: the V5 round (docs/round2_v5/RESULTS.md).  In particular, the one
# change that ever beat the frozen release was a single large raw-TabM member on
# the time column mixed at weight 0.2, and the only reason the iron column never
# got that lever is that the V3.6 sampler fixed iron_capacity to "small".

