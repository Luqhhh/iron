signature:
  stage_a:
    residual_correlation_max: 0.95
    accuracy_ratio_max: 1.25
    projected_nested_fold_gain_min: 0.0
    folds: [0, 1]
    split_seed: 42
  stage_b:
    residual_correlation_max: 0.95
    accuracy_ratio_max: 1.15
    positive_cells_min: 8
    positive_cells_total: 10
    split_seeds: [42, 3407]
    folds: [0, 1, 2, 3, 4]
  mutual_diversity:
    max_members_per_structural_family: 1
    mutual_residual_correlation_max: 0.95
    note: enforced across every selected candidate of a target, in stage A and again in stage B

fusion:
  alpha_search_bounds: [0.05, 0.5]
  alpha_grid_points: 46
  weight_objective: pooled_wmape_at_fixed_alpha_mean_over_seeds
  no_alpha_scan_at_release: true

budget:
  stage_a_new_fits: 0
  stage_a2_iron_capacity_screen:
    purpose: "coarse screen of the new iron capacity space, which has no recorded folds 0/1 predictions"
    target: tap_iron
    max_fit_slots: 64
    seeds: [42]
    folds: [0, 1]
    note: "32 trials x 2 folds; this is the only way the new space can enter the signature screen"
    gated_on: "stage A must yield at least one admissible candidate in either target"
  stage_b:
    max_trials_per_target: 6
    max_fit_slots_per_target: 60
    max_fit_slots_total: 120
    seeds: [42, 3407]
    folds: [0, 1, 2, 3, 4]
  stage_c:
    derived_seeds: [7777, 12011]
    max_candidates: 2
    reuse_cached_baselines: true
    max_candidate_fit_slots: 20
    baseline_cache: "local/runs/round2-v5-error-covariance/replication-r1/seed-{seed}/fold-{fold}.npz"
  stage_d:
    max_packages: 1
    full_data_fits: 1
  wall_clock_cap_hours: 3
  workers: 16

gates:
  promotion:
    unit: split_seed
    min_seeds: 4
    paired_lcb_level: 0.95
    require_paired_lcb_gt_zero: true
    require_all_contributing_seeds_positive: true
    fold_level_role: descriptive_only
    fold_reference_pair: [8, 10]
  release:
    single_target_replacement_only: true
    require_unchanged_column_byte_identical: true
    require_read_back_verification: true
    require_cold_check: true
    alpha_basis: all_seed_grid_optimum
  platform_submission:
    frozen_local_working_gate: 96.25
    gate_rederivation: PENDING_USER_DECISION
    measured_offset_range: [0.0347, 0.1008]
    note: "a candidate below the frozen gate may only be submitted under recorded explicit user authorisation, as V5_TIME_N0048_Q20 was"

stop_rules:
  - "stage A uses only recorded folds 0/1 predictions; no fit is spent before a candidate is admissible"
  - "if neither target yields an admissible stage A candidate, stop and report; do not fit the new iron capacity space"
  - "if stage B yields no candidate with a positive nested mean and at least 8 of 10 positive cells, stop before stage C"
  - "if stage C admits nothing, stop; no package is built"
  - "no threshold in this file may be relaxed during execution; a failed gate is recorded as failure"

non_goals:
  - NODE_per_depth_selection
  - ODST_core
  - TabR_retrieval_fusion
  - residual_correctors
  - sample_reweighting_or_manual_prediction_edits
  - dense_alpha_grid_scan
  - temporal_or_lag_features
  - researching_the_existing_oof_pool_for_more_members
  - seed_or_loss_diversity_inside_one_structural_family

retracted_claims:
  - "constant 0.005 local-to-platform transfer error"
  - "a local gain of about +0.01 implies a platform gain of about +0.01"

publication:
  upload_actor: user
  agent_uploads: 0
  no_automatic_packages: true
  daily_cap_user_stated: 5
  private_outputs_only: local/runs/round2-v6-*
