schema_version: 1
decision_status: frozen_by_ai
baseline_id: baseline-v0.1
targets: [tap_iron, tap_time_len]
parameters:
  loss_function: MAE
  eval_metric: MAE
  iterations: 800
  depth: 5
  learning_rate: 0.03
  l2_leaf_reg: 5.0
  random_seed: 2026
  task_type: CPU
  thread_count: 8
  bootstrap_type: 'No'
  random_strength: 0.0
  rsm: 1.0
  boosting_type: Plain
  has_time: true
  one_hot_max_size: 64
  nan_mode: Min
  use_best_model: false
  allow_writing_files: false
  verbose: false
categorical_features: [spout_no]
max_categorical_cardinality: 64
controls:
  global: B0
  per_spout: {id: B1, min_group_count: 20, fallback: B0}
postprocessing:
  lower_bound: 0.0
  csv_decimals: 6
