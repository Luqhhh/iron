    - do not slice a global OOF residual file and train an outer residual model
  J:
    priority: small_budget_exploration
    units_max: 8
    question: is there asymmetric cross-target information beyond current joint members?
    mechanisms:
      J1: shared_low_dimensional_projection_with_private_functions
      J2: shared_only_control
      J3: fully_independent_control
      J4: X_to_predicted_time_to_iron
      J5: X_to_predicted_iron_to_time
    guards:
