followup:
  repair_version: SEED_INIT_V2
  candidate_trial_id: N-N2-tap_iron-SEED_INIT_V2
  line: N
  recipe: N2
  target: tap_iron
  numeric_encoding: raw
  split_seeds: [42, 3407]
  training_seed: 42
  coarse_folds: [0, 1]
  full_folds: [0, 1, 2, 3, 4]
  path: fixed_quarter
  fixed_quarter_weight: 0.25
  # Fold state machine.  An incomplete full coverage is explicitly *not* a
  # failure and *not* a pass.
  stage_states:
    - PASSED
    - FAILED
    - NOT_EVALUATED
    - NOT_EVALUATED_INCOMPLETE_COVERAGE
  gates:
    coarse:
      same_path_both_seeds: true
      both_seed_gains_positive: true
      mean_full_package_gain_min: 0.005
    full_coverage:
      mean_gain_min: 0.02
      both_seeds_positive: true
      positive_folds_min: 8
  unchanged:
