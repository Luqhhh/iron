    - learning_rate
    - tree_count
    - depth
    - routing_temperature
    - encoding
    - fusion_weight
  identity_required:
    - data_hash
    - train_and_evaluation_ids_and_order
    - group_hash
    - fold_vector
    - model_recipe
    - encoder_and_target_transform
    - initialisation_and_batch_order_seeds
    - model_and_training_source_digest
    - dependency_identity

path_b:
  # Design only: the per-depth selector is the next hypothesis to test, and it
  # is never started merely because path A missed a gate.
  enabled: false
  candidate_trial_id: N-N2_DEPTHSELECT-tap_iron
  base_recipe: N2
  hypothesis: |
    A single tree currently reuses one feature projection at every depth; only
    the threshold changes.  Allowing each depth to select its own feature is a
    different, still-oblivious model: every node at one depth still shares that
    depth's feature and threshold, but the four depths need not agree.
  source_comparison:
    in_repo: "bf_tap_r2.v4_2_n_node:_ObliviousLayer.feature_logits -> (trees, features)"
    reference: "Qwicen/node/lib/odst.py: the selector carries a depth axis"
  proposed_change:
    feature_logits_shape: [trees, depth, features]
    selectors: "entmax15(feature_logits, dim=-1)"
    z: "einsum('bf,tdf->btd', x, selectors)"
    route: "sigmoid(z - threshold[trees, depth])"
    removes: "depth-shared feature projection"
    keeps:
      - raw numeric encoding
      - two layers
      - 64 trees per layer
      - depth 4
      - linear head
      - threshold initialisation
      - fixed routing temperature
      - MAE objective
      - AdamW optimiser
      - early-stopping protocol
    forbidden_additions:
      - learnable_temperature
      - data_aware_initialisation
      - ple_encoding
      - more_trees
  required_control: |
    The repaired shared-selector N-N2-tap_iron-SEED_INIT_V2, never the
    pre-repair N2 whose initialisation seed was not controlled.
  reporting:
    - true_parameter_count
    - capacity_increase_is_not_a_strict_equal-capacity_causal_proof
  acceptance_checks:
    - "binding every depth's selector to one vector reproduces the shared-selector forward output"
    - "perturbing one depth's selector does not rewrite another depth's selector"
    - "the selector gradient is non-zero for each depth"
    - "serialisation round-trips the (trees, depth, features) shape"
    - "outputs and gradients are checked numerically, not inferred from a class name"
  budget:
    coarse_slots: 4
    extend_slots: 6
    coarse_slot_definition: "two split seeds x folds 0/1"
    extension_precondition: |
      Same pre-declared path positive in both split seeds, mean full-package
      gain >= 0.005, and a positive mean increment against the shared-selector
      control; then add the six remaining slots.
    mixes_with_path_a: false
  note: |
    This is the next-step design under enabled: false.  It does not reuse or
    rename the failed R/S units, and it does not weaken the original
    full-coverage gate.
