# Round2 V4.2-r2 follow-up declarations.
#
# This file records two things that are *not* part of the frozen V4.2
# pre-registration in SEARCH_SPEC.yaml:
#
#   1. the N2 seed-initialisation repair identity and its stage gates;
#   2. the design of the next structural hypothesis, per-depth feature
#      selection, which is declared with ``enabled: false`` and must not be
#      started automatically in this plan.
#
# Editing SEARCH_SPEC.yaml is not required and its frozen thresholds are not
# duplicated here.

