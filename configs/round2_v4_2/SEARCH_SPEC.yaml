# Round2 V4.2 declarative search specification (draft, pre-registration).
#
# This file is the machine-readable form of the 2026-09-25 V4.2 task book.  It is
# the single source of truth read by `bf_tap_r2.v4_2_spec` and the V4.2 runner.
# Editing any fixed value here changes the pre-registration; the runner refuses
# a specification whose hard constraints do not hold.

schema_version: v4.2
status: EXECUTED_COARSE_SCREEN_NO_PROMOTION
# Execution record: local/runs/round2-v4.2-structure-search/coarse-r1
# 96/96 outer recipe slots completed; 2 gate-passing units, both N/tap_iron and
# both only through the pre-declared fixed_quarter path.  Nothing was packaged
# or uploaded.  See docs/round2_v4_2/RESULTS.md.
date: 2026-09-25
base_commit: 4821d2eb15e7bfd3fe2f3c3728a4c83487d1185f
branch: round2-v4.1-strong-increment

experiment:
  name: round2_v4_2_structure_search
  user_target_platform_score: 93.5          # preserved verbatim from the user
  user_requested_outer_failed: 96.2734      # user-returned, not independently verified
  improvement_basis: complete_v3_6          # never re-submit an already-delivered package
  note: |
    The three model lines below ask a new question: can changing sample
    relations, tree routing and functional form end-to-end produce a new strong
    predictor?  All three learn the target y directly and never use the B36
    residual as a training label.

data_contract:
  snapshot: round2_v2
  numeric_features: 21
  categorical_features: [spout_no]
  train_rows: 2754
  test_rows: 322
  external_data: forbidden
  pretrained_weights: forbidden
  test_labels: forbidden
  id_or_row_order_features: forbidden
  per_row_prediction_editing: forbidden
  official_dependency_installs: allowed
  example_data_downloads: forbidden
  private_artifacts: [models, training_support_sets, labels, oof]

references:
  b_replay:
    class: bf_tap_r2.v4_1_reference.V36DevelopmentReference
    role: regression_test_and_diagnostics_only
    historical_mean_package_score: 96.20376256899247
  b_fit:
    class: bf_tap_r2.v4_1_reference.V36FixedRecipeFactory
    role: formal_relative_increment_reference
  rule: |
    B_fit and every new model are fitted on the same outer training part T and
    evaluated on the same outer evaluation part V.  A difference against
    B_replay is never reported as a gain over B_fit.

common_training:
  target_scaling: train_subset_mean_abs      # m = mean(abs(y)), m > 0
  metric: original_unit_wmape
  neural_loss: mae                           # R and N share one fixed scheme
  symbolic_loss: absolute_error
  neural_starting_point:
    optimizer: adamw
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 256
    max_epochs: 1000
    early_stopping_patience: 50
    initialisation_seed: 42
    note: design values for this round, not an external paper's optimum
  early_stopping_metric: original_unit_wmape
  refit_rule: |
    After the epoch count is determined on the inner U/H split, refit on the
    complete training part T.  V is never used for early stopping.
  unstable_trial_label: budget_limited

lines:
  R:
    evidence:
      - https://arxiv.org/abs/2307.14338
      - https://github.com/yandex-research/tabular-dl-tabr
    implementation_status: ADAPTED_TABR_STYLE_IMPLEMENTATION_NOT_PAPER_REPRODUCTION
    neighbour_search: exact_euclidean_in_learned_representation
    faiss: not_used
    starting_point:
      repr_width: 128
      n_blocks: 2
      n_neighbors: 32
      dropout: 0.10
      ple_segments: 8
    recipes:
      R0: {retrieval: false, use_support_labels: false, numeric_encoding: raw,  counts_as_retrieval_success: false}
      R1: {retrieval: true,  use_support_labels: false, numeric_encoding: raw,  counts_as_retrieval_success: true}
      R2: {retrieval: true,  use_support_labels: true,  numeric_encoding: raw,  counts_as_retrieval_success: true}
      R3: {retrieval: true,  use_support_labels: true,  numeric_encoding: ple,  counts_as_retrieval_success: true}
    isolation:
      outer_evaluation_in_support: forbidden
      inner_early_stop_part_in_support: forbidden
      self_or_exact_duplicate_retrieval: forbidden
      test_rows_in_support: forbidden
      test_labels_readable: false
      only_current_target_support_labels_opened: true
      small_sample_k: min(32, legal_support_count)
      no_legal_support: explicit_error_or_documented_fallback
      distance_ties: symmetric_admit_all_ties_at_kth
      support_serialisation: model_state_with_source_id_and_fit_row_hashes
      cold_inference_may_read_model_memory: true
      cold_inference_may_reopen_training_csv: false
    acceptance_checks:
      - R1 truly masks the label channel
      - R2 label changes only affect the allowed training memory
      - self and duplicate-group retrieval count is zero
      - V and H are absent from the support set
      - retrieval parameters receive nonzero gradient and are updated
      - chunked, reversed and single-row inference agree
      - exact distances are cross-checked against a brute-force reference

  S:
    evidence:
      - https://pysr.ai/v1.5.9/options
    hypothesis: |
      Only this is tested: whether a constrained short nonlinear expression can
      learn a more effective combination of the current inputs than the existing
      models.  No assumption is made that the data was generated by a
      recoverable formula.
    inputs: [standardised_21_numeric, spout_no_indicator]
    recipes:
      S0: {operators: [add, sub, mul]}
      S1: {operators: [add, sub, mul, safe_ratio]}
      S2: {operators: [add, sub, mul, tanh, log1p_abs]}
      S3: {operators: [add, sub, mul, safe_ratio, tanh, log1p_abs]}
    limits:
      max_nodes: 24
      max_depth: 5
      eval_budget_per_training_subset: 200000
      max_candidates: 12
      beam_width: 48
      no_improve_rounds: 4
      constant_refit_max_nfev: 400
      constant_bound: 100.0
    forbidden_operators: [bare_division, power, sin, cos, conditionals]
    no_self_nesting: [nonlinear_unary, safe_ratio]
    backend:
      primary: pysr
      fallback: in_repo_bounded_ast_search
      freeze_rule: |
        The backend budget-control question must be answered and frozen before
        the first real training run; it is never silently ignored.
      verified:
        pysr_version: "2.5.0"
        exact_budget_parameter: max_evals
        budget_controllable: true
        independent_environment: local/envs/v4_2_pysr
        julia_depot: local/envs/julia-depot
        example_data_download_used: false
    workflow:
      - search structure and initial constants on the inner training part U
      - keep at most 12 candidates of different complexity
      - select the formula on the inner validation part H by original-unit WMAPE
      - ties broken by the shorter formula
      - re-estimate that structure's constants on the complete training part T only
      - a deeper OOF layer must re-search inside that layer's own training subset
      - export the selected AST, preprocessing, constants and legal NumPy operations
      - backend and exported inference must agree on real and boundary inputs
      - nonfinite output is a failure, never patched for a specific row
      - only the globally frozen non-negative output handling is inherited

  N:
    evidence:
      - https://arxiv.org/abs/1909.06312
      - https://github.com/Qwicen/node
    implementation_status: ADAPTED_NODE_STYLE_IMPLEMENTATION_NOT_PAPER_REPRODUCTION
    total_trees: 128
    depth: 4
    recipes:
      N0: {numeric_encoding: raw, n_layers: 1, trees_per_layer: 128}
      N1: {numeric_encoding: ple, n_layers: 1, trees_per_layer: 128}
      N2: {numeric_encoding: raw, n_layers: 2, trees_per_layer: 64}
      N3: {numeric_encoding: ple, n_layers: 2, trees_per_layer: 64}
    parameter_matching_claim: none
    report: [true_parameter_count, training_volume, peak_memory]
    required_operators: [differentiable_feature_selection, soft_routing]
    hard_argmax: forbidden
    diagnostics: [routing_entropy, leaf_usage, parameter_update]
    environment: independent_reproducible_with_limited_concurrency
    v36_locked_environment_upgrade: forbidden
    example_data_downloads: forbidden

screen:
  units: 24
  unit_definition: "4 recipes x 2 targets x 3 lines"
  seeds: [42, 3407]
  folds: [0, 1]
  outer_recipe_slots: 96
  slot_note: "24 x 2 seeds x 2 folds; not a fit count"
  paths:
    direct: "target t replaced entirely by the new model, the other target stays B_fit"
    fixed_quarter: "0.75 * B_fit_t + 0.25 * f_t, the other target stays B_fit"
  fixed_quarter_weight: 0.25
  weight_scan: forbidden
  oracle_weight_on_same_labels: forbidden
  score:
    formula: "S = max(0, 100 - 50 * (W_I + W_T))"
    single_target_increment_when_unclamped: "50 * (W_B - W_C)"
    recompute_on_combined_prediction: true
    per_seed_pooling: "pool numerators and denominators over covered samples, then average seed scores"
  continuation_gate:
    same_fixed_path_for_both_seeds: true
    both_seed_gains_positive: true
    mean_full_package_gain_min: 0.005
    r0_control_never_counts_as_retrieval_success: true
  selection:
    max_per_family_per_target: 1
    max_total_finalists: 6
    order: [better_mean_gain_across_two_paths, worse_seed_gain, fixed_trial_id]

full_coverage:
  add_folds: [2, 3, 4]
  max_new_outer_recipe_slots: 36
  refit_completed_folds: forbidden
  fusion_eligibility_gate:
    mean_gain_min: 0.02
    both_seeds_positive: true
    positive_folds_min: 8
    positive_folds_total: 10
  stop_rule_if_gate_fails: stop_the_line_no_alpha_rescue_scan

fusion:
  form: "P_t = (1 - a_t) * B_fit_t + a_t * f_t"
  max_new_models_per_target: 1
  alpha_grid: [0, 0.1, 0.25, 0.5, 1]
  inner_folds: 3
  inner_folds_group_safe: true
  refit_both_endpoints_in_every_inner_U_H: true
  r_support_from_U_only: true
  s_expressions_discovered_in_U_only: true
  select_alpha_on_aligned_inner_oof: true
  tie_break: smaller_alpha
  alpha_zero_fallback_allowed: true
  evaluate_on_V_after_fixing_alpha: true
  forbidden: "slicing the full-data outer OOF as an inner OOF"
  baseline_cache:
    reusable: true
    key_fields: [exact_train_ids, exact_train_groups, model_recipe, preprocessing, source_hash, dependency_identity]
    missing_cache_may_substitute_b_replay: false
  ledger_required: [real_base_fits, neural_fits, formula_searches, constant_refits]

replication:
  max_complete_recipes: 2
  recipes_per_target_max: 1
  rerun_training_seed: 3407
  split_seed_and_training_seed_logged_separately: true
  max_new_outer_recipe_slots: 20
  b_fit_cache_reused: true
  structure_reselection_on_second_seed: forbidden
  gates:
    mean_gain_min: 0.02
    both_split_seeds_positive: true
    positive_folds_min: 8
  final_training_seed: 42
  final_alpha_selection: full_training_internal_oof
  weight_selection_on_test_predictions: forbidden

submission:
  max_preferred_packages: 1
  auto_upload: false
  remaining_quota_assumption: unknown
  preserve: [v36_original, hashes, platform_feedback_mapping]
  last_vs_best_rule: "follow the verified platform rule; do not infer from contradictory notes"
  cold_audit:
    - v2_id_set
    - template_order
    - three_columns
    - nonnegative_finite
    - result_readback
    - model_readback
    - full_reverse_chunk_subset_single_row_consistency
    - training_csv_read_ban
    - private_data_out_of_repository
  tabr_support_set_is_private_model_state: true
