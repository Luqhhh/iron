[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bf-tap-predict"
version = "0.1.0"
description = "Leakage-safe baseline for blast-furnace tap prediction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "catboost==1.2.8",
  "lightgbm==4.6.0",
  "numpy==2.2.6",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "psutil==5.9.0",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
round2 = [
    "interpret==0.6.10",
    "rtdl-num-embeddings==0.0.12",
    "rtdl-revisiting-models==0.0.2",
    "scikit-learn==1.8.0",
    "tabm==0.0.3",
    "torch==2.14.0",
    "xgboost==2.1.4",
]
# Round2 V4.2 structure search.  ``torch`` powers the R (retrieval) and N
# (differentiable oblivious tree) lines; ``sympy`` converts PySR equations back
# into the frozen V4.2 expression language.  PySR itself is deliberately not
# listed here: the S line installs it into the independent interpreter
# ``local/envs/v4_2_pysr`` with its own Julia depot, so the frozen V3.6
# environment is never upgraded.  See docs/round2_v4_2/S_BACKEND_FREEZE.md.
round2_v4_2 = [
    "torch>=2.4",
    "sympy==1.14.0",
]

# CPU-only tests use the same torch release as the frozen V7--V13 runtime.
# This installs libraries, not pretrained weights, and leaves experiment specs intact.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
bf-tap = "bf_tap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bf_tap", "src/bf_tap_r2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "model: requires CatBoost and exercises model persistence",
]
