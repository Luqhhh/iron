[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bf-tap-predict"
version = "0.1.0"
description = "Leakage-safe baseline for blast-furnace tap prediction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "catboost==1.2.8",
  "numpy==2.2.6",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "psutil==5.9.0",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
bf-tap = "bf_tap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bf_tap"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "model: requires CatBoost and exercises model persistence",
]
